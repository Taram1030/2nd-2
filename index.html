<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>삼각형의 외심, 내심 마스터</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1f2937;--muted:#6b7280;--purple:#6d5dfc;--green:#16a34a;--red:#dc2626;--gold:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#f5f3ff,#f8fafc);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid #e5e7eb;backdrop-filter:blur(10px)}
.toprow{display:flex;align-items:center;gap:10px;padding:10px 16px}.brand{font-weight:950}.spacer{flex:1}.pill{padding:7px 10px;border-radius:999px;background:#ede9fe;font-weight:850;font-size:13px}.iconbtn{border:0;background:#f3f4f6;border-radius:11px;padding:9px 11px;font-weight:800}
.stampbar{display:flex;justify-content:center;gap:9px;padding:4px 12px 10px;overflow-x:auto}.topstamp{width:52px;height:52px;flex:0 0 52px;border-radius:50%;overflow:hidden;background:#f3f4f6;border:2px solid #d1d5db;filter:grayscale(1);opacity:.42;transition:.3s}.topstamp.done{filter:none;opacity:1;background:#fff;border-color:#f59e0b;transform:rotate(-5deg) scale(1.07);box-shadow:0 4px 12px rgba(245,158,11,.25)}.topstamp img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:1180px;margin:auto;padding:18px}.hero{padding:30px;border-radius:26px;background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;box-shadow:0 18px 42px rgba(76,29,149,.2)}.hero h1{font-size:clamp(30px,6vw,50px);margin:0 0 8px}.startbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.startbox input{min-width:240px;border:0;border-radius:12px;padding:13px}
.primary,.secondary,.danger{border-radius:12px;padding:11px 15px;font-weight:900}.primary{border:0;background:var(--purple);color:#fff}.secondary{border:1px solid #d1d5db;background:#fff}.danger{border:0;background:var(--red);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#7c3aed,#22c55e);transition:.3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin-top:14px}.booth-card,.panel{background:#fff;border-radius:21px;padding:18px;box-shadow:0 10px 26px rgba(15,23,42,.07)}.booth-card{border:2px solid transparent}.booth-card.done{border-color:#22c55e;background:#f0fdf4}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:900}.game-title{font-size:23px;font-weight:950;margin:12px 0 4px}.subtitle{color:var(--muted);min-height:44px}.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.cardstamp{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid #d1d5db;filter:grayscale(1);opacity:.32}.cardstamp img{width:100%;height:100%;object-fit:cover;display:block}.done .cardstamp{filter:none;opacity:1;border-color:#f59e0b}.back{margin-bottom:12px}.instructions{display:grid;gap:10px}.step{display:flex;gap:12px;background:#f8fafc;padding:12px;border-radius:14px}.num{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;background:#ede9fe;color:#5b21b6;font-weight:900}.quizbox{margin-top:18px;padding:16px;border-radius:16px;background:#fff7ed}.question{font-size:23px;font-weight:950;margin:12px 0}.options{display:grid;gap:8px}.option,.bigchoice{padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-weight:850;text-align:left}.option.correct{background:#f0fdf4;border-color:#22c55e}.option.wrong{background:#fef2f2;border-color:#ef4444}.success{padding:12px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:900;margin-top:10px}.feedback{min-height:28px;margin-top:10px;font-weight:850}.approval{border-top:1px dashed #d1d5db;margin-top:16px;padding-top:14px}.approval-row{display:flex;gap:8px;flex-wrap:wrap}.approval input{padding:11px;border:1px solid #d1d5db;border-radius:11px}
.construction-layout{display:grid;grid-template-columns:220px 1fr;gap:14px}.construction-main{position:relative}.answer-toggle-wrap{position:absolute;right:10px;top:0;z-index:5}.answer-toggle{border:2px solid #7c3aed;background:#fff;color:#5b21b6;border-radius:12px;padding:9px 13px;font-weight:950;box-shadow:0 5px 14px rgba(91,33,182,.14)}.answer-toggle:active{transform:translateY(1px)}.toolbar{display:grid;gap:8px;align-content:start}.tool{padding:11px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-weight:850;text-align:left}.tool.active{background:#ede9fe;border-color:#7c3aed;color:#5b21b6}.hint{background:#eff6ff;color:#1e3a8a;padding:11px 13px;border-radius:12px;margin-bottom:10px}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.mini{font-size:13px;font-weight:800;background:#f3f4f6;border-radius:999px;padding:6px 9px}.canvas-wrap{border:1px solid #e5e7eb;border-radius:18px;padding:8px;background:#fafafa}.canvas{display:block;width:100%;height:min(62vh,560px);background:#fff;border-radius:12px;touch-action:none}.gamebox{max-width:850px;margin:auto}.counter{font-weight:950;color:#5b21b6}.triangle-stage{height:420px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;overflow:hidden}.triangle-stage svg{width:100%;height:100%;touch-action:none}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigchoice{text-align:center;font-size:20px;padding:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bucket{min-height:220px;border:2px dashed #c4b5fd;border-radius:18px;padding:14px;background:#faf5ff}.cardchip{padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;margin:8px 0}.cardchip.selected{outline:3px solid #a78bfa}.cardchip.correct{background:#f0fdf4}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:20px;padding:20px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.teacher-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.teacher-grid input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px}.recordbox{padding:12px;border-radius:14px;background:#f8fafc;margin-top:12px}.footer-note{font-size:13px;color:var(--muted)}
.answer-circle{stroke-dasharray:12 8;animation:drawAnswer 1.1s ease-out forwards,answerPulse 1.8s ease-in-out 1.1s infinite;transform-origin:center} @keyframes drawAnswer{from{stroke-dashoffset:520;opacity:.15}to{stroke-dashoffset:0;opacity:1}} @keyframes answerPulse{0%,100%{stroke-width:6;opacity:1}50%{stroke-width:10;opacity:.7}}
@media(max-width:760px){.construction-layout{grid-template-columns:1fr}.answer-toggle-wrap{position:static;display:flex;justify-content:flex-end;margin-bottom:8px}.toolbar{grid-template-columns:repeat(3,1fr)}.tool{text-align:center;font-size:12px;padding:9px}.canvas{height:52vh}.cards,.choicegrid{grid-template-columns:1fr}.brand{font-size:14px}.topstamp{width:44px;height:44px;flex-basis:44px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="toprow"><div class="brand">△ 삼각형의 외심, 내심 마스터</div><div class="spacer"></div><div id="studentPill" class="pill hidden"></div><div id="progressPill" class="pill hidden">0 / 7</div><button id="teacherBtn" class="iconbtn">교사용</button></div>
 <div id="stampBar" class="stampbar"></div>
</header>
<main>
<section id="startScreen" class="hero"><h1>삼각형의 외심, 내심 마스터</h1><p>7개의 게임 부스를 돌며 외심과 내심의 비밀을 찾아보세요.</p><div class="startbox"><input id="studentName" placeholder="학번과 이름 입력"><button id="startBtn" class="primary">스탬프 투어 시작</button></div></section>
<section id="mapScreen" class="hidden"><div class="section-title"><h2>부스 지도</h2><strong id="mapStatus"></strong></div><div class="progress"><div id="progressBar"></div></div><div id="boothGrid" class="grid"></div><div class="panel" style="margin-top:18px"><h2>🏆 최종 활동 · 삼각형 중심 마스터</h2><p>수업 종료 5분 전 선생님이 활동을 열면 참여할 수 있습니다.</p><button id="finalEnter" class="primary">선생님이 열어 주세요</button></div></section>
<section id="activityScreen" class="hidden"></section>
</main>
<div id="teacherModal" class="modal hidden"><div class="modalbox"><h2>교사용 설정</h2><div id="teacherLogin"><input id="teacherPassword" type="password" placeholder="교사용 비밀번호" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px"><button id="teacherLoginBtn" class="primary" style="width:100%;margin-top:10px">확인</button></div><div id="teacherSettings" class="hidden"><p>부스별 도우미 승인 코드</p><div id="codeInputs" class="teacher-grid"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button id="saveCodes" class="primary">저장</button><button id="openFinal" class="secondary">최종 활동 열기</button><button id="closeFinal" class="secondary">최종 활동 닫기</button><button id="resetAll" class="danger">학생 기록 초기화</button></div><div id="teacherRecord" class="recordbox"></div><p class="footer-note">기본 비밀번호: 2026. 이 파일만 사용하는 버전에서는 각 기기의 기록이 그 기기에만 저장됩니다.</p></div><button id="closeTeacher" class="secondary" style="width:100%;margin-top:14px">닫기</button></div></div>

function stampSvg(i){return `<img src="${stampImages[i-1]}" alt="부스 ${i} 도장">`}
function setScreen(n){$('#startScreen').classList.toggle('hidden',n!=='start');$('#mapScreen').classList.toggle('hidden',n!=='map');$('#activityScreen').classList.toggle('hidden',n!=='activity')}
function updateTop(){const count=Object.values(state.done).filter(Boolean).length;$('#studentPill').classList.toggle('hidden',!state.name);$('#progressPill').classList.toggle('hidden',!state.name);$('#studentPill').textContent=state.name;$('#progressPill').textContent=`${count} / 7`;$('#stampBar').innerHTML=boothMeta.map(b=>`<div class="topstamp ${state.done[b.id]?'done':''}" title="부스 ${b.id}">${stampSvg(b.id)}</div>`).join('')}
function renderMap(){updateTop();const count=Object.values(state.done).filter(Boolean).length;$('#mapStatus').textContent=`${count}개 완료`;$('#progressBar').style.width=`${count/7*100}%`;$('#boothGrid').innerHTML=boothMeta.map(b=>`<article class="booth-card ${state.done[b.id]?'done':''}"><span class="badge">부스 ${b.id}</span><div class="game-title">${b.title}</div><div class="subtitle">${b.sub}</div><div class="card-footer"><button class="primary" onclick="openBooth(${b.id})">${state.done[b.id]?'다시 보기':'도전하기'}</button><div class="cardstamp">${stampSvg(b.id)}</div></div></article>`).join('');$('#finalEnter').disabled=!state.finalOpen;$('#finalEnter').textContent=state.finalOpen?'최종 활동 입장':'선생님이 열어 주세요';setScreen('map')}
$('#startBtn').onclick=()=>{const n=$('#studentName').value.trim();if(!n)return alert('학번과 이름을 입력하세요.');state.name=n;save();renderMap()};
function shell(title,sub,body){$('#activityScreen').innerHTML=`<button class="secondary back" onclick="renderMap()">← 부스 지도</button><div class="panel"><span class="badge">활동 부스</span><h2 style="font-size:30px;margin-bottom:4px">${title}</h2><p style="color:#6b7280">${sub}</p>${body}</div>`;setScreen('activity');scrollTo(0,0)}
function approvalBlock(id,ready){return `<div class="approval"><h3>도우미 승인</h3><p>${ready?'활동 성공! 도우미에게 화면을 보여주세요.':'먼저 활동을 성공해야 합니다.'}</p><div class="approval-row"><input id="code${id}" placeholder="도우미 승인 코드" ${ready?'':'disabled'}><button class="primary" onclick="approve(${id})" ${ready?'':'disabled'}>스탬프 받기</button></div><div id="approveMsg${id}"></div></div>`}
window.approve=id=>{if($(`#code${id}`).value.trim()===String(codes[id])){state.done[id]=true;save();$(`#approveMsg${id}`).innerHTML='<div class="success">🎉 스탬프 획득 완료!</div>';updateTop()}else alert('승인 코드가 맞지 않습니다.')};
window.openBooth=id=>{if(id<=2)renderFold(id);else if(id<=4)renderConstruction(id);else if(id===5)renderPointGame();else if(id===6)renderCardGame();else renderOX()};

function nextPointQuestion(){const all=['acuteO','rightO','obtuseO','acuteI','rightI','obtuseI','circCircle','incCircle'],avail=all.filter(x=>!pointGame.used.includes(x));const type=(avail.length?avail:all)[Math.floor(Math.random()*(avail.length||all.length))];pointGame.used.push(type);const isI=type.includes('I')||type==='incCircle';let tri;if(type.startsWith('right'))tri=[[180,330],[180,90],[650,330]];else if(type.startsWith('obtuse'))tri=[[110,330],[300,140],[710,330]];else tri=[[150,340],[390,70],[670,340]];const pts=tri.map(p=>({x:p[0],y:p[1]})),ans=isI?incenter(...pts):circumcenter(...pts);$('#pointQuestion').textContent=`${isI?'내심':'외심'}의 위치를 찍으세요.`;let extra='';if(type==='circCircle')extra=`<circle cx="${ans.x}" cy="${ans.y}" r="${dist(ans,pts[0])}" fill="none" stroke="#a78bfa" stroke-width="3"/>`;if(type==='incCircle'){const r=pointLineDistance(ans,pts[0],pts[1]);extra=`<circle cx="${ans.x}" cy="${ans.y}" r="${r}" fill="none" stroke="#34d399" stroke-width="3"/>`}const svg=$('#pointSvg');svg.innerHTML=`${extra}<polygon points="${tri.map(p=>p.join(',')).join(' ')}" fill="#eef2ff" stroke="#111827" stroke-width="4"/>`;svg.onpointerdown=e=>{const r=svg.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width*800,y:(e.clientY-r.top)/r.height*420},gap=dist(p,ans);svg.querySelectorAll('.mark').forEach(x=>x.remove());svg.insertAdjacentHTML('beforeend',`<circle class="mark" cx="${p.x}" cy="${p.y}" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>`);if(gap<42){pointGame.success++;if(gap<pointGame.best){pointGame.best=gap;if(!state.bestPoint||gap<state.bestPoint.distance){state.bestPoint={name:state.name,distance:gap,date:new Date().toLocaleString('ko-KR')};save();showPointBest()}}$('#pointCounter').textContent=`성공 ${pointGame.success} / 5`;$('#pointFeedback').innerHTML='<span style="color:#166534">정답! 다음 문제로 이동합니다.</span>';if(pointGame.success>=5){svg.onpointerdown=null;$('#pointFeedback').innerHTML='<div class="success">5문제 성공! 가장 정확했던 한 번이 기록되었습니다.</div>';$('#approvalWrap').innerHTML=approvalBlock(5,true)}else setTimeout(nextPointQuestion,600)}else $('#pointFeedback').innerHTML='<span style="color:#b91c1c">조금 더 정확한 위치를 찾아보세요.</span>'}}
function renderCardGame(){const cards=[['세 변의 수직이등분선의 교점','O'],['세 각의 이등분선의 교점','I'],['세 꼭짓점까지의 거리가 같다','O'],['세 변까지의 거리가 같다','I'],['외접원의 중심','O'],['내접원의 중심','I'],['직각삼각형에서는 빗변의 중점','O'],['항상 삼각형의 내부에 있다','I']].sort(()=>Math.random()-.5);shell(boothMeta[5].title,boothMeta[5].sub,`<p>카드를 누른 뒤 외심 또는 내심 영역을 누르세요.</p><div id="sourceCards">${cards.map((c,i)=>`<div class="cardchip" data-a="${c[1]}">${c[0]}</div>`).join('')}</div><div class="cards"><div class="bucket" data-b="O"><h3>외심</h3></div><div class="bucket" data-b="I"><h3>내심</h3></div></div><div id="cardFeedback"></div><div id="approvalWrap"></div>`);let selected=null;$('#sourceCards').onclick=e=>{const c=e.target.closest('.cardchip');if(!c)return;$$('.cardchip').forEach(x=>x.classList.remove('selected'));selected=c;c.classList.add('selected')};$$('.bucket').forEach(b=>b.onclick=()=>{if(!selected)return;if(selected.dataset.a===b.dataset.b){selected.classList.remove('selected');selected.classList.add('correct');b.appendChild(selected);selected=null;if(!$('#sourceCards .cardchip')){$('#cardFeedback').innerHTML='<div class="success">모든 카드를 분류했습니다!</div>';$('#approvalWrap').innerHTML=approvalBlock(6,true)}}else{selected.classList.add('wrong');setTimeout(()=>selected&&selected.classList.remove('wrong'),500)}})}
function renderOX(){const bank=[['내심은 항상 삼각형의 내부에 있다.',true],['외심은 항상 삼각형의 내부에 있다.',false],['외심은 세 꼭짓점까지의 거리가 같다.',true],['내심은 세 변까지의 거리가 같다.',true],['직각삼각형의 외심은 빗변의 중점이다.',true],['둔각삼각형의 외심은 삼각형의 내부에 있다.',false],['외심은 각의 이등분선의 교점이다.',false]];const qs=bank.sort(()=>Math.random()-.5).slice(0,5);let i=0,score=0;shell(boothMeta[6].title,boothMeta[6].sub,`<div class="gamebox"><div id="oxCounter" class="counter"></div><div id="oxQuestion" class="question"></div><div id="oxChoices" class="choicegrid"><button class="bigchoice" data-v="true">⭕ 맞다</button><button class="bigchoice" data-v="false">❌ 아니다</button></div><div id="oxFeedback" class="feedback"></div><div id="approvalWrap"></div></div>`);function show(){if(i===5){$('#oxChoices').classList.add('hidden');$('#oxCounter').textContent=`점수 ${score} / 5`;if(score===5){$('#oxQuestion').textContent='OX 미션 성공!';$('#oxFeedback').innerHTML='<div class="success">5문제를 모두 맞혔습니다!</div>';$('#approvalWrap').innerHTML=approvalBlock(7,true)}else{$('#oxQuestion').textContent='모두 맞혀야 통과할 수 있어요.';$('#oxFeedback').innerHTML='<button class="secondary" onclick="openBooth(7)">새 문제로 다시 도전</button>'}return}$('#oxCounter').textContent=`${i+1} / 5`;$('#oxQuestion').textContent=qs[i][0]}show();$('#oxChoices').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(String(qs[i][1])===b.dataset.v)score++;i++;show()}}
$('#finalEnter').onclick=()=>{if(!state.finalOpen){alert('선생님이 아직 최종 활동을 열지 않았습니다.');return}renderFinal()};
function renderFinal(){const qs=[['세 꼭짓점까지의 거리가 같은 점은?','외심',['외심','내심','무게중심']],['세 변까지의 거리가 같은 점은?','내심',['외심','내심','수심']],['직각삼각형의 외심 위치는?','빗변의 중점',['빗변의 중점','직각인 꼭짓점','삼각형의 외부']],['항상 삼각형 내부에 있는 점은?','내심',['외심','내심','수심']],['외심과 내심이 같은 삼각형은?','정삼각형',['정삼각형','직각삼각형','둔각삼각형']]];let i=0,score=0;shell('삼각형 중심 마스터','수업 종료 5분 전 모두 함께 해결하는 최종 활동',`<div class="gamebox"><div id="finalCounter" class="counter"></div><div id="finalQ" class="question"></div><div id="finalOpts" class="options"></div><div id="finalFb" class="feedback"></div></div>`);function show(){if(i===qs.length){state.finalDone=true;save();$('#finalCounter').textContent=`최종 점수 ${score} / 5`;$('#finalQ').textContent='최종 활동 완료!';$('#finalOpts').innerHTML='';$('#finalFb').innerHTML=`<div class="success">🏆 ${state.name}, 삼각형 중심 마스터 도전을 완료했습니다!</div>`;return}$('#finalCounter').textContent=`${i+1} / 5`;$('#finalQ').textContent=qs[i][0];$('#finalOpts').innerHTML=qs[i][2].map(o=>`<button class="option">${o}</button>`).join('')}show();$('#finalOpts').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.textContent===qs[i][1])score++;i++;show()}}
$('#teacherBtn').onclick=()=>$('#teacherModal').classList.remove('hidden');$('#closeTeacher').onclick=()=>$('#teacherModal').classList.add('hidden');$('#teacherLoginBtn').onclick=()=>{if($('#teacherPassword').value!=='2026')return alert('비밀번호가 맞지 않습니다.');$('#teacherLogin').classList.add('hidden');$('#teacherSettings').classList.remove('hidden');$('#codeInputs').innerHTML=boothMeta.map(b=>`<label>부스 ${b.id}<input id="tc${b.id}" value="${codes[b.id]}"></label>`).join('');updateTeacherRecord()};
function updateTeacherRecord(){$('#teacherRecord').innerHTML=state.bestPoint?`<strong>현재 기기의 점찍기 최고 기록</strong><br>${state.bestPoint.name}: ${state.bestPoint.distance.toFixed(1)} (${state.bestPoint.date})`:'현재 기기에 저장된 점찍기 기록이 없습니다.'}
$('#saveCodes').onclick=()=>{for(let i=1;i<=7;i++)codes[i]=$(`#tc${i}`).value.trim();localStorage.setItem('triangleTourCodesV2',JSON.stringify(codes));alert('저장했습니다.')};$('#openFinal').onclick=()=>{state.finalOpen=true;save();renderMap();alert('최종 활동을 열었습니다.')};$('#closeFinal').onclick=()=>{state.finalOpen=false;save();renderMap();alert('최종 활동을 닫았습니다.')};$('#resetAll').onclick=()=>{if(confirm('현재 기기의 모든 학생 기록을 초기화할까요?')){localStorage.removeItem('triangleTourStateV2');location.reload()}};
updateTop();if(state.name)renderMap();else setScreen('start');
</script>
